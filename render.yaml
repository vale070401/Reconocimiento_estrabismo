services:
  - type: web
    name: reconocimiento-estrabismo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /auth/health
    envVars:
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?user=postgres.jrfmcepglxmolpdblvyc&sslmode=require
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0
