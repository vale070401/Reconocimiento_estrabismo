services:
  - type: web
    name: reconocimiento-estrabismo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /auth/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://detecteyebased.cxi028a2qjlg.us-east-2.rds.amazonaws.com:5432/detecteyebased
      - key: DB_USERNAME
        value: detecteye_admin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0
