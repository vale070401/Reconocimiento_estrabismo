spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://detecteyebased.cxi028a2qjlg.us-east-2.rds.amazonaws.com:5432/detecteyebased}
spring.datasource.username=${DB_USERNAME:detecteye_admin}
spring.datasource.password=${DB_PASSWORD:Eldiavlo11.}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL bind parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
# JWT Configuration
jwt.secret=${JWT_SECRET:eYzz8p7tCbdxvrqk4jPf+3nknoe8ZFWXZccWpFRgBkqYA5AVglCKFlwOO1Kbcf6TpzHyOdeosV1k0DonoA7ifg==}
jwt.expiration=${JWT_EXPIRATION:3600000}
#Correo Electronico
#El servidor SMTP que usaremos. En este caso el de Gmail.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
sendgrid.api.key=${SENDGRID_API_KEY:""}
#El puerto que usa SMTP con SSL (seguridad).
spring.mail.port=${MAIL_PORT:587}
#El Correo que envie los mensajes
spring.mail.username=${MAIL_USERNAME}
#Generamos una Contrase�a para apps externas con google
spring.mail.password=${MAIL_PASSWORD}
#obliga a que el servidor SMTP pida usuario y contrase�a.
spring.mail.properties.mail.smtp.auth=true
# TLS/SSL
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Timeouts para evitar bloqueos
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

logging.level.org.springframework.mail=DEBUG

# CORS Configuration
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
server.forward-headers-strategy=framework
# Render sets PORT, map it to Spring server.port with default 80
server.port=${PORT:8080}
