# Configuración de la base de datos en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de logging para pruebas
logging.level.org.springframework=INFO
logging.level.com.Deteccion_estrabismo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuración de seguridad para pruebas
security.jwt.secret=testSecretKey1234567890123456789012345678901234567890
security.jwt.expiration=86400000

# Configuración de autenticación para pruebas
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=ADMIN

# Deshabilitar CSRF para pruebas
spring.security.csrf.enabled=false

# Configuración de CORS para pruebas
cors.allowed-origins=*
cors.allowed-methods=*
cors.allowed-headers=*

# Configuración de caché para pruebas
spring.cache.type=none
